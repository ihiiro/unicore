<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dark Mode Homepage</title>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    header {
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    h1 {
      color: #bb86fc;
    }
    a {
      color: #bb86fc;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    footer {
      border-top: 1px solid #333;
      padding-top: 10px;
      margin-top: 40px;
      font-size: 0.9em;
      color: #999;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to the Dark Side</h1>
  </header>

  <main>
    <p>This is a simple homepage designed with a dark mode style.</p>
    <p>Check out more at <a href="#">our site</a>.</p>
  </main>

  <footer>
    &copy; 2025 Dark Mode Homepage
  </footer>
</body>
</html>
